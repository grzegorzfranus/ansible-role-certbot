---
galaxy_info:
  role_name: certbot
  author: Grzegorz Franus
  namespace: grzegorzfranus
  description: >
    Ansible role to install and configure Certbot for automated Let's Encrypt SSL/TLS
    certificate management. Supports HTTP-01 and DNS-01 validation (Cloudflare, Route53,
    DigitalOcean), wildcard certificates, automatic renewal configuration, and secure revocation.
  license: Apache-2.0
  company: EWARE
  min_ansible_version: "2.16"

  platforms:
    - name: Debian
      versions:
        - "bookworm"
    - name: Ubuntu
      versions:
        - "noble"

  galaxy_tags:
    - certbot
    - letsencrypt
    - ssl
    - tls
    - certificate
    - https
    - cloudflare
    - route53
    - digitalocean
    - dns
    - acme
    - security
    - encryption

dependencies: []
